server:
  port: 8081

app:
  greeting: 中文打招呼来自config
  "greeting.fallback": Hi

spring:
  datasource:
    url: jdbc:h2:mem:playground;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
